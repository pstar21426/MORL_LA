# 5G downlink single-UE Link Adaptation (Sionna SYS learning sandbox)
#
# Scenario: one gNB → one UE, PDSCH MCS selection every slot.
# Channel quality is an effective-SINR process (correlated in time).
# ACK/NACK comes from Sionna PHYAbstraction BLER tables (not a toy tanh).

num_slots: 400
seed: 0

# NR MCS / LA
bler_target: 0.1          # OLLA/ILLA target TBLER
mcs_table_index: 1        # 38.214 Table 5.1.3.1-1 (PDSCH)
mcs_category: 1           # 1 = downlink (PDSCH)
num_allocated_re: 1000    # REs allocated to the UE in the slot

# Effective SINR process [dB] (placeholder for full OFDM/RT channel)
sinr_mean_db: 8.0
sinr_ar_rho: 0.95          # temporal correlation |rho|<1
sinr_innov_std_db: 1.2     # innovation noise std
sinr_min_db: -5.0
sinr_max_db: 25.0

# Imperfect CQI feedback (what the LA controller observes)
cqi_noise_std_db: 1.5     # additive Gaussian noise on SINR feedback
cqi_delay_slots: 0        # 0 = same-slot feedback (raise later)

# Output
out_dir: outputs
save_plot: true
save_npz: true
