# 5G DL single-UE link adaptation (Sionna PHYAbstraction)

num_slots: 400
seed: 0

bler_target: 0.1
mcs_table_index: 1        # 38.214 Table 5.1.3.1-1 (PDSCH)
mcs_category: 1           # 1 = downlink
num_allocated_re: 1000

# Time-correlated effective SINR [dB]
sinr_mean_db: 10.0
sinr_ar_rho: 0.95
sinr_innov_std_db: 2.5
sinr_min_db: -15.0
sinr_max_db: 35.0
# null → fixed operating point at sinr_mean_db
sinr_mean_range_db: null
sinr_mean_change_prob: 0.0

# Imperfect CSI before CQI quantization (delay + noise on true SINR)
cqi_noise_std_db: 1.5
# null → randint(1, 5) = {1,2,3,4} once per episode; int → fixed delay
cqi_delay_slots: null
# reported CQI = max q s.t. TBLER(MCS(q), SINR_hat) <= target (via PHYAbstraction)
cqi_bler_target: 0.1
# BS holds period-average CQI between reports (LTE ~40 ms @ 1 ms/slot -> 40)
cqi_report_period: 40
# first-tx ACK/NACK visible to BS after TB finish + this many slots
ack_delay_slots: 8
# srsRAN-style OLLA SNR step (dB); step_down = step_up * (1/BLER - 1)
olla_step_up_db: 0.001

# HARQ-IR (MI accumulation)
mi_combining_rho: 0.9
harq_max_retx: 2
drop_penalty: 6.0

# State history (decision-step): [cqi x L, m x L, b x L]
state_num_lags: 3

collect_epsilons: [0.0]

out_dir: outputs
save_plot: true
save_npz: true
