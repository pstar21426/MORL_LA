num_slots: 1000
seed: 0

bler_target: 0.1          # OLLA / MCS 선택의 목표 1st-tx TBLER
mcs_table_index: 1        # 38.214 PDSCH MCS 테이블 1
mcs_category: 1           # 1 = downlink
num_allocated_re: 300

# effective SINR
# clip 범위는 PHYAbstraction BLER 보간 그리드. AR(1)은 정상상태 분산에서 시작
sinr_mean_db: 10.0
sinr_ar_rho: 0.95
sinr_innov_std_db: 2.5   # 정상상태 std = innov / sqrt(1-rho^2) ≈ 8 dB
sinr_min_db: -5.0
sinr_max_db: 30.0
# null이면 sinr_mean_db 고정. 범위 주면 에피소드 중 평균 SINR이 가끔 바뀜
sinr_mean_range_db: null
sinr_mean_change_prob: 0.0

# CQI 양자화 전 CSI 오차 (진짜 SINR에 delay + 잡음 + 편향)
# cqi_bias_db > 0 이면 CQI용 SINR이 데이터 채널보다 낙관적이다.
cqi_noise_std_db: 1.5
cqi_bias_db: 3.0
# null이면 에피소드마다 delay를 1~4 사이 정수 하나 뽑음. 정수면 고정 delay
cqi_delay_slots: 3
# 매 슬롯 CQI = TBLER(MCS(q), SINR_hat) ≤ target 인 최대 q
cqi_bler_target: 0.1
# TB 끝난 뒤 이만큼 슬롯 지나야 초전송 ACK가 관측/히스토리에 들어감
ack_delay_slots: 0
# OLLA SNR 스텝. step_down = step_up * (1/BLER - 1)
olla_step_up_db: 0.1

# HARQ-IR: 초전송은 raw SNR, 재전송은 평균 MI → SNR_eff, 같은 Qm/원래 TBS
# harq_max_retx는 재전송 횟수. 초기 전송은 포함하지 않음.
# harq_retx_gap_slots: 재전송 앞에 비우는 슬롯. 그 슬롯은 도착만 한다.
harq_max_retx: 3
harq_retx_gap_slots: 3
drop_penalty: 0.0         # HARQ 포기 보상은 0. 전달되지 않은 비트는 D에 없다.

# 결정 시점 state: [cqi_n, past_cqi×L, m×L, b×L, queue/capacity]
state_num_lags: 3

# 비트 버퍼. RB 수는 고정. 슬롯마다 아래 범위의 비트가 균등 도착한다.
# 상태 큐 = 비트/용량. ACK 보상 = 전달 비트/RE. 오버플로는 보상에서 빼지 않는다.
arrival_bits_min: 300
arrival_bits_max: 500
queue_capacity: 15000
overflow_penalty: 0.0

# run_la_sim 평가 시드. null이면 [seed]만
eval_seeds: [0, 1, 2, 3, 4]
collect_epsilons: [0.0]

out_dir: outputs
save_plot: true
save_npz: true

# train_ddqn.py
train:
  episodes: 200
  log_every: 20
  eval_seeds: [1, 2, 3]   # 학습은 seed..seed+episodes-1. 겹치면 train_ddqn이 밀어냄

ddqn:
  hidden: 256
  buffer_size: 100000
  batch_size: 64
  gamma: 0.99
  lr: 0.001
  target_sync: 200
  epsilon_start: 1.0
  epsilon_end: 0.01
  # 200 ep × 대략 650 TB ≈ 1.3e5 step. 앞 3만 step만 ε decay
  epsilon_decay_steps: 30000
